stages:
  - test
  - build

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

default:
  interruptible: true

test:
  stage: test
  image: rust:1-bookworm
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
    CARGO_TARGET_DIR: "$CI_PROJECT_DIR/target"
  cache:
    key:
      files:
        - Cargo.lock
      prefix: "rust-linux"
    paths:
      - .cargo/
      - target/
  script:
    - cargo test --lib --no-default-features
    - cargo check --lib --no-default-features

package:windows:
  stage: build
  tags:
    - saas-windows-medium-amd64
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
    CARGO_TARGET_DIR: "$CI_PROJECT_DIR/target"
    RUSTUP_HOME: "$CI_PROJECT_DIR/.rustup"
  cache:
    key:
      files:
        - Cargo.lock
      prefix: "rust-windows"
    paths:
      - .cargo/
      - .rustup/
      - target/
  before_script:
    - >-
      if (-not (Test-Path "$($env:CARGO_HOME)\bin\cargo.exe")) {
      Invoke-WebRequest -Uri https://win.rustup.rs/x86_64 -OutFile rustup-init.exe;
      .\rustup-init.exe -y --profile minimal --default-toolchain stable --no-modify-path
      };
      $env:PATH = "$($env:CARGO_HOME)\bin;$env:PATH";
      cargo --version;
      rustc --version
    - cargo fetch --locked
  script:
    - cargo test --lib --no-default-features
    - cargo build --release --locked
    - >-
      $tokens = $null;
      $parseErrors = $null;
      [System.Management.Automation.Language.Parser]::ParseFile(
      (Join-Path $PWD "resources/fanbridge/FanBridge.ps1"),
      [ref]$tokens,
      [ref]$parseErrors
      ) | Out-Null;
      if ($parseErrors.Count -gt 0) {
      $parseErrors | ForEach-Object { Write-Error $_.Message };
      exit 1
      }
    - New-Item -ItemType Directory -Force dist | Out-Null
    - Copy-Item target\release\t1-control.exe dist\t1-control-windows-x64.exe
    - Copy-Item README.md dist\README.md
    - Copy-Item LICENSE dist\LICENSE
    - Compress-Archive -Path dist\t1-control-windows-x64.exe,dist\README.md,dist\LICENSE -DestinationPath dist\t1-control-windows-x64.zip -Force
  artifacts:
    name: "t1-control-windows-$CI_COMMIT_SHORT_SHA"
    expire_in: 30 days
    paths:
      - dist/t1-control-windows-x64.zip
